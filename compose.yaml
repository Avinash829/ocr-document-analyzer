services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    volumes:
      - paddle-models:/home/app/.paddlex

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  paddle-models:
